version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Major bumps here need a planned upgrade: typescript-eslint caps TypeScript,
    # eslint and @eslint/js move together, and @types/node follows the Node runtime.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Every @remotion package must stay on the same exact version, so they move together.
  - package-ecosystem: npm
    directory: /video
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    # Same rule as the root package: major bumps of the toolchain need a planned upgrade.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      remotion:
        patterns: ["remotion", "@remotion/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
