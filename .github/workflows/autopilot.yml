name: Autopilot

# The whole chain on a schedule, up to a public YouTube upload: news, script,
# approval, audio, video, upload. The rules (daily cap, freshness, which QC
# findings hold a script for a person) live in app_settings.autopilot.
# To stop everything: disable this workflow in the Actions tab, or set
# app_settings.autopilot.enabled to false.
on:
  schedule:
    # Every hour from 06:23 to 22:23 Italian winter time.
    - cron: "23 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: video

      # Each step may fail on its own (a feed down, a provider error) without
      # holding back the work of the steps after it.
      - name: News
        continue-on-error: true
        run: npm run job:ingest

      - name: Script
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run job:autopilot -- --step editorial

      - name: Queue audio
        continue-on-error: true
        run: npm run job:autopilot -- --step advance

      - name: Audio
        continue-on-error: true
        env:
          GOOGLE_TTS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_TTS_CREDENTIALS_JSON }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ vars.AZURE_TTS_REGION }}
        run: npm run job:audio

      - name: Queue video
        continue-on-error: true
        run: npm run job:autopilot -- --step advance

      - name: Video
        continue-on-error: true
        run: npm run job:video

      - name: Queue upload
        continue-on-error: true
        run: npm run job:autopilot -- --step advance

      # The ids are UUIDs checked by the CLI, and travel through a file, never
      # into the shell text unquoted.
      - name: Upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUBLICATION_MODE: automatic
          ALLOW_PUBLIC_PUBLICATION: "true"
          OGNIORA_ENV: production
        run: |
          npm run -s job:autopilot -- --step uploads > "$RUNNER_TEMP/uploads.txt"
          status=0
          while read -r id; do
            [ -n "$id" ] || continue
            npm run -s job:distribute -- --queue-id "$id" || status=1
          done < "$RUNNER_TEMP/uploads.txt"
          exit $status
