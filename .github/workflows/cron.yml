name: Flash Info Cron

# Legacy pipeline, manual only. The empty "schedule:" key left by the commented
# cron made this file invalid; the schedule stays off by design and must not be
# restored here: scheduling moves to n8n.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-flash-info
  cancel-in-progress: false

env:
  NEWS_CATEGORIA: Italia   # ← cambia qui per cambiare categoria globalmente
  NEWS_NUM: "5"

jobs:
  flash-info:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg

      - name: Install dipendenze
        run: npm ci --ignore-scripts

      # ── Step 1: genera script e audio ──────────────────────────────────────

      - name: Genera script e audio
        env:
          APP_URL:     ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/generate.mjs

      # ── Step 2: crea video con FFmpeg ───────────────────────────────────────

      - name: Crea video con FFmpeg
        run: |
          ffmpeg -y \
            -loop 1 \
            -i assets/thumbnail.jpg \
            -i /tmp/flash.mp3 \
            -c:v libx264 \
            -tune stillimage \
            -c:a aac \
            -b:a 192k \
            -pix_fmt yuv420p \
            -shortest \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            /tmp/flash.mp4
          echo "Video creato: $(du -h /tmp/flash.mp4 | cut -f1)"

      # ── Step 3: upload su YouTube ───────────────────────────────────────────

      - name: Upload su YouTube
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/upload-youtube.mjs
